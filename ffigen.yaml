# Generates lib/src/parser/native/bindings.dart from native/include/mdx_native.h.
# Regenerate with `sh tool/generate_bindings.sh`.
name: MdxNativeBindings
description: |
  @Native bindings for the C ABI of the native parser (`native/`).
  Generated by tool/generate_bindings.sh. Do not edit by hand.

  The library is registered as a code asset by `hook/build.dart`, and the `@Native`
  annotations here refer to that asset. The asset name must match `_assetName` in `hook/build.dart`.
language: c
output: lib/src/parser/native/bindings.dart
# libclang locations, tried in order: Xcode on macOS, then apt's libclang-dev on Linux
# (the first directory that has lib/libclang is used).
llvm-path:
  - /Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain
  - /usr/lib/llvm-20
  - /usr/lib/llvm-19
  - /usr/lib/llvm-18
  - /usr/lib/llvm-17
  - /usr/lib/llvm-16
  - /usr/lib/llvm-15
  - /usr/lib/llvm-14
headers:
  entry-points:
    - native/include/mdx_native.h
  include-directives:
    - native/include/mdx_native.h
ffi-native:
  asset-id: package:flutter_markdown_x/src/parser/native/bindings.dart
preamble: |
  // ignore_for_file: type=lint
comments:
  style: any
  length: full
functions:
  include:
    - mdx_.*
  # Short synchronous call that never calls back into Dart, so mark it as a leaf.
  leaf:
    include:
      - mdx_.*
