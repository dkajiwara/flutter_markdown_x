[package]
name = "mdx_native"
version = "0.0.1"
edition = "2021"
description = "Markdown to flutter_markdown_x IR, exposed through a C ABI."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# Keep panic at the default unwind so that `mdx_parse` can catch the panic with catch_unwind
# and return null (with abort, a panic would terminate the whole app).
# wasm32-unknown-unknown cannot unwind, so a panic becomes a trap. See doc/native-abi.md.
