# Generates the C header (include/mdx_native.h) from the `extern "C"` items in native/src/lib.rs.
# Regenerate with `sh tool/generate_bindings.sh`.
language = "C"
include_guard = "MDX_NATIVE_H"
header = "/* Generated by tool/generate_bindings.sh (cbindgen). Do not edit by hand. */"
cpp_compat = false
documentation = true
documentation_style = "c99"
usize_is_size_t = true
sys_includes = ["stddef.h", "stdint.h"]
no_includes = true

[parse]
parse_deps = false

# mdx_alloc / mdx_dealloc, exported only on wasm32, are wrapped in `#[cfg(target_arch = "wasm32")]`.
# In the header they are wrapped in `#if defined(MDX_TARGET_WASM32)`, so they are not exposed
# to native consumers (Dart FFI).
[defines]
"target_arch = wasm32" = "MDX_TARGET_WASM32"
