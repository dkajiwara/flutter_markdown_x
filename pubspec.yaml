name: flutter_markdown_x
description: "Fast Markdown renderer for Flutter: CommonMark and GFM, inline HTML, streaming-friendly incremental updates, powered by a bundled Rust parser (FFI and WebAssembly)."
version: 0.1.0
repository: https://github.com/dkajiwara/flutter_markdown_x
topics:
  - markdown
  - rendering
  - streaming
  - ffi
  - wasm

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  code_assets: ^2.2.0
  cupertino_ui: ^1.1.7
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  hooks: ^2.2.0
  # Types only (md.Element, md.ExtensionSet, md.BlockSyntax, md.InlineSyntax). Parsing is Rust.
  markdown: ^7.3.1
  # p.join and p.current for web image paths (flutter_markdown parity).
  material_ui: ^1.11.1
  path: ^1.9.0

dev_dependencies:
  crypto: ^3.0.6
  # Pin exactly so the generated output does not change (tool/generate_bindings.sh).
  ffigen: 23.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_markdown_plus: ^1.0.12
  flutter_widget_from_html_core: ^0.17.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  assets:
    - prebuilt/web/mdx_native.wasm

  # To add assets to your package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
