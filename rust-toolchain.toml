# The toolchain that built the binaries in prebuilt/. If you change it, rebuild the binaries and
# update the manifest with `dart run tool/prebuilt_manifest.dart --write`.
# rustup searches from the cwd, so keep this at the repo root that --manifest-path builds from.
[toolchain]
channel = "1.93.0"
components = ["rustfmt", "clippy"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "x86_64-apple-ios",
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "x86_64-linux-android",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "wasm32-unknown-unknown",
]
